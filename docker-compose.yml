services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: nina_admin
      POSTGRES_PASSWORD:: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment or ignored .env file}"
      POSTGRES_DB: nina_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nina_admin -d nina_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS:: "${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in your local environment or ignored .env file}"
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
